name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Inject web into server (for go:embed)
        run: cp -r web/dist server/dist
      - name: Build agent
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # 发布公钥。设了它，agent 就会强制校验 SHA256SUMS 的 ed25519 签名；
          # 没设就退回「https + 校验和」。两者必须同批到位——公钥注进了二进制
          # 却没有对应的 .sig，agent 会拒绝一切升级。
          RELEASE_PUBKEY: ${{ vars.MOSS_RELEASE_PUBKEY }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags "-s -w -X main.agentVersion=${VER} -X main.releasePubKey=${RELEASE_PUBKEY}" \
            -o "dist-out/moss-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./agent
      - name: Build server (embed_web)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          go build -tags embed_web -trimpath -ldflags "-s -w -X main.serverVersion=${VER}" -o "dist-out/moss-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./server
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist-out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum moss-* > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS

      # 给校验和清单签名。
      #
      # 校验和只能证明「传输没坏」，证不了「二进制是官方的」——SHA256SUMS 与
      # 二进制来自同一个地址，能替换二进制的镜像同样能替换清单。而境内机器
      # 用镜像是常态（MOSS_RELEASE_BASE 就是为此存在的）。签名把信任从传输层
      # 挪到发布者，是这条链路上唯一能防住敌意镜像的手段。
      #
      # 未配置密钥时跳过：此时 agent 侧也没有公钥可注入，两边一致地退回
      # 「https + 校验和」。配置方法见 docs/release-signing.md。
      - name: Sign checksums
        env:
          SIGNING_KEY: ${{ secrets.MOSS_RELEASE_PRIVKEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::未配置 MOSS_RELEASE_PRIVKEY，本次发布不带签名（agent 将退回校验和校验）"
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" > /tmp/signing.key
          go run ./tools/sign -key /tmp/signing.key -in artifacts/SHA256SUMS -out artifacts/SHA256SUMS.sig
          shred -u /tmp/signing.key
          echo "已生成 SHA256SUMS.sig"
      - name: Extract changelog for this tag
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" { p = 1; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # 带预发布后缀的 tag（v2.0.0-beta.1、v2.0.0-rc.1）自动标为 Pre-release，
          # 正式版 tag（v2.0.0）不受影响。按 tag 名判断而非手工勾选，
          # 免得某次发测试版忘了勾，用户当成稳定版装上去。
          prerelease: ${{ contains(github.ref_name, '-') }}
